name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    env:
      # La firma release es opcional en CI: si no hay secretos, el APK se genera
      # sin firmar y las pruebas/build siguen ejecutándose.
      TEQRUTA_KEYSTORE_BASE64: ${{ secrets.TEQRUTA_KEYSTORE_BASE64 }}
      TEQRUTA_KEYSTORE_PASSWORD: ${{ secrets.TEQRUTA_KEYSTORE_PASSWORD }}
      TEQRUTA_KEY_ALIAS: ${{ secrets.TEQRUTA_KEY_ALIAS }}
      TEQRUTA_KEY_PASSWORD: ${{ secrets.TEQRUTA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Los runners ubuntu-latest ya traen el SDK de Android instalado. Se usa ese
      # (en lugar de android-actions/setup-android, que falla al pedir el paquete
      # "tools" eliminado) y se aceptan licencias / instalan componentes faltantes.
      - name: Preparar SDK de Android
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          if [ -n "$SM" ] && [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || true
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore de release (opcional)
        if: env.TEQRUTA_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$HOME/.config/teqruta"
          echo "$TEQRUTA_KEYSTORE_BASE64" | base64 --decode > "$HOME/.config/teqruta/teqruta-release.jks"
          cat > "$HOME/.config/teqruta/keystore.properties" <<EOF
          storeFile=$HOME/.config/teqruta/teqruta-release.jks
          storePassword=$TEQRUTA_KEYSTORE_PASSWORD
          keyAlias=$TEQRUTA_KEY_ALIAS
          keyPassword=$TEQRUTA_KEY_PASSWORD
          EOF
          chmod 600 "$HOME/.config/teqruta/teqruta-release.jks" "$HOME/.config/teqruta/keystore.properties"

      - name: Pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: APK debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: APK release (firmado si hay keystore, si no sin firmar)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: teqruta-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
